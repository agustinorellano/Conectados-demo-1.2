<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2A2A35"/>
      <stop offset="100%" stop-color="#1A1A22"/>
    </radialGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A46E"/>
      <stop offset="50%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#8B5E2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Outer circuit ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#copper)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#copper)" stroke-width="1" opacity="0.4"/>
  <!-- Circuit nodes on ring -->
  <circle cx="100" cy="20" r="4" fill="#C8A46E" filter="url(#glow)"/>
  <circle cx="180" cy="100" r="4" fill="#C8A46E" filter="url(#glow)"/>
  <circle cx="100" cy="180" r="4" fill="#C8A46E" filter="url(#glow)"/>
  <circle cx="20" cy="100" r="4" fill="#C8A46E" filter="url(#glow)"/>
  <circle cx="157" cy="43" r="3" fill="#C8A46E" opacity="0.8"/>
  <circle cx="43" cy="157" r="3" fill="#C8A46E" opacity="0.8"/>
  <!-- Central book/circuit hybrid -->
  <rect x="72" y="72" width="56" height="56" rx="4" fill="none" stroke="url(#copper)" stroke-width="2.5"/>
  <!-- Pages -->
  <line x1="100" y1="76" x2="100" y2="124" stroke="url(#copper)" stroke-width="2"/>
  <line x1="80" y1="84" x2="96" y2="84" stroke="#C8A46E" stroke-width="1.5" opacity="0.7"/>
  <line x1="80" y1="92" x2="96" y2="92" stroke="#C8A46E" stroke-width="1.5" opacity="0.7"/>
  <line x1="80" y1="100" x2="96" y2="100" stroke="#C8A46E" stroke-width="1.5" opacity="0.7"/>
  <!-- Wrench -->
  <line x1="104" y1="86" x2="118" y2="114" stroke="url(#copper)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="118" cy="114" r="5" fill="none" stroke="url(#copper)" stroke-width="2.5"/>
  <circle cx="104" cy="86" r="5" fill="none" stroke="url(#copper)" stroke-width="2.5"/>
</svg>
